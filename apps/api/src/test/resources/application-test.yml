spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: localhost
    port: 1025

warroom:
  environment: local
  auth:
    app-base-url: http://localhost:3000
    api-base-url: http://localhost:8080
    from-email: test@warroom.local
    magic-link-ttl-minutes: 20
    session-ttl-days: 30
    expose-magic-link: true
    trust-forwarded-host: false
    admin-emails: support@warroom.test
    # O limite real é coberto por MagicLinkRateLimiterTest; aqui os testes fazem muitos logins.
    magic-link-requests-per-window: 100000
    magic-link-requests-per-address: 100000
    magic-link-window-minutes: 15
  billing:
    mode: demo
    platform-fee-bps: 1800
    min-budget-cents: 20000
    currency: brl
    stripe-api-key: ""
    stripe-webhook-secret: ""
  cors:
    allowed-origins: http://localhost:3000
