spring:
  application:
    name: warroom-api
  datasource:
    url: ${WARROOM_DB_URL:jdbc:postgresql://localhost:5435/warroom}
    username: ${WARROOM_DB_USER:warroom}
    password: ${WARROOM_DB_PASSWORD:warroom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${WARROOM_SMTP_HOST:localhost}
    port: ${WARROOM_SMTP_PORT:11027}
    username: ${WARROOM_SMTP_USER:}
    password: ${WARROOM_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${WARROOM_SMTP_AUTH:false}
          starttls:
            enable: ${WARROOM_SMTP_STARTTLS:false}

server:
  port: ${WARROOM_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

warroom:
  # local ou production. Em production o modo financeiro demo é recusado na inicialização.
  environment: ${WARROOM_ENVIRONMENT:local}
  auth:
    app-base-url: ${WARROOM_APP_BASE_URL:http://localhost:3000}
    api-base-url: ${WARROOM_API_BASE_URL:http://localhost:8080}
    from-email: ${WARROOM_FROM_EMAIL:noreply@warroom.local}
    magic-link-ttl-minutes: 20
    session-ttl-days: 30
    expose-magic-link: ${WARROOM_EXPOSE_MAGIC_LINK:false}
    trust-forwarded-host: ${WARROOM_TRUST_FORWARDED_HOST:false}
    # Contas de suporte (papel admin). Só por configuração; ninguém escolhe admin na API.
    admin-emails: ${WARROOM_ADMIN_EMAILS:}
    magic-link-requests-per-window: ${WARROOM_MAGIC_LINK_LIMIT:5}
    magic-link-requests-per-address: ${WARROOM_MAGIC_LINK_ADDRESS_LIMIT:60}
    magic-link-window-minutes: ${WARROOM_MAGIC_LINK_WINDOW_MINUTES:15}
  billing:
    # demo: provedor simulado, sinalizado em API e painel; stripe: exige STRIPE_API_KEY e STRIPE_WEBHOOK_SECRET.
    mode: ${WARROOM_BILLING_MODE:demo}
    platform-fee-bps: ${WARROOM_PLATFORM_FEE_BPS:1800}
    min-budget-cents: ${WARROOM_MIN_BUDGET_CENTS:20000}
    currency: ${WARROOM_CURRENCY:brl}
    stripe-api-key: ${STRIPE_API_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  cors:
    allowed-origins: ${WARROOM_CORS_ORIGINS:http://localhost:3000}
  totalrecall:
    provision-token: ${TOTALRECALL_PROVISION_TOKEN:}

logging:
  level:
    root: INFO
    br.com.ricarte.warroom: INFO
