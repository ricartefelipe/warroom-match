databaseChangeLog:
  - changeSet:
      id: 002-totalrecall-password
      author: warroom
      changes:
        - addColumn:
            tableName: accounts
            columns:
              - column: { name: password_hash, type: varchar(255) }
              - column: { name: enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: expires_at, type: timestamptz }
